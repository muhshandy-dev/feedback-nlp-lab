name: Periksa situs live

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL situs"
        default: "https://feedback-nlp-lab.pages.dev"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Periksa
        env:
          URL: ${{ inputs.url }}
        run: python tools/check_live.py "$URL"
