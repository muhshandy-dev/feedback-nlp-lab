name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Pasang
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unduh dan verifikasi NusaX
        run: feedbacklab data fetch
      - name: Tes (termasuk reproduksi results.json byte demi byte)
        run: pytest --cov=feedbacklab --cov-report=term-missing
      - name: Pemeriksaan independen angka website
        run: python tools/verify_published.py

  encoder-code:
    # Menguji jalur kode fine-tuning dengan BERT mini acak di CPU; bukan hasil IndoBERT.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang (torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,encoder]"
      - run: feedbacklab data fetch
      - run: pytest tests/test_encoder.py -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pasang dependensi
        working-directory: web
        run: npm ci
      - name: Tes paritas model browser dan metrik
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Pasang Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Tes e2e, CSP, aksesibilitas, responsif
        working-directory: web
        run: SHOT_DIR=$RUNNER_TEMP/screenshots npm run e2e
      - name: Audit dependensi
        working-directory: web
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 7
